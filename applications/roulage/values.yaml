---
name: roulage
image: roulage-frontend
# imageTag lives in versions/nsr.yaml — written by CI, loaded after this file.
# Setting it here too would create a second source of truth that always loses.

containerPort: 3000
host: roulage.sk
wwwAlias: true

persistence:
  data:
    # SQLite database.
    size: 128Mi
    mountPath: /app/data
  uploads:
    # Uploaded flyers and DJ sets. Inside Next.js' public/ tree, so these are
    size: 1Gi
    mountPath: /app/public/media

# Nightly K8up backup to the Storage Box (charts/app README, "Backups").
# Both volumes are backed up file by file; the live SQLite file is left out of
# that and dumped consistently with VACUUM INTO instead. Retention is the
# chart default.
backup:
  enabled: true
  # Slot 5 of the cluster's backup window, Europe/Bratislava — the table in
  # infrastructure/backup/README.md assigns every app's slot; change it there
  # first.
  schedule:
    backup: "0 4 * * *"
    check: "30 5 * * 3"   # Wednesday, backup + 1h30
    prune: "30 5 * * 0"   # Sunday, backup + 1h30
  sqlite:
    files:
      # The path in DATABASE_URI below, on the `data` volume. roulage's
      # payload.config.ts reads DATABASE_URI.
      - /app/data/roulage.db

env:
  DATABASE_URI: file:/app/data/roulage.db
  # PAYLOAD_SECRET: "" # Moved into vault
  NEXT_PUBLIC_SERVER_URL: https://roulage.sk
  # Extra origins (comma-separated) allowed to log into the admin / call the
  # API, in addition to NEXT_PUBLIC_SERVER_URL. Only needed when the site is
  # reached from more than one origin (e.g. bare IP for testing, or www).
  ALLOWED_ORIGINS: https://www.roulage.sk,https://roulage.sk
  # NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-} # moved into vault

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi