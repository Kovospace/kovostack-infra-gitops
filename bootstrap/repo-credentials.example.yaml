---
# Repository credentials for a private repo. Copy, fill in, apply by hand —
# do NOT commit the filled-in version:
#
#   cp bootstrap/repo-credentials.example.yaml /tmp/repo-creds.yaml
#   $EDITOR /tmp/repo-creds.yaml
#   kubectl apply -f /tmp/repo-creds.yaml && rm /tmp/repo-creds.yaml
#
# This is the one secret that cannot come from external-secrets: ArgoCD needs it
# to read the repo that defines external-secrets in the first place.
#
# `url` must match spec.source.repoURL in the Applications *exactly*, including
# the scheme — ArgoCD picks credentials by matching that string. The repo
# currently uses the SSH form, i.e. option A below.
#
# ---------------------------------------------------------------------------
# Option A — deploy key (SSH). In use. Scoped to this repo, read-only.
#   ssh-keygen -t ed25519 -C argocd@kovostack -f ./argocd-deploy-key -N ''
#   Add the .pub under  Repo → Settings → Deploy keys  (leave "Allow write" off).
#
#   The key must have no passphrase — ArgoCD has no ssh-agent and cannot prompt.
#   Prefer `kubectl create secret --from-file` over pasting it in here; see
#   bootstrap/README.md.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: repo-kovostack-infra-gitops
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:Kovospace/kovostack-infra-gitops.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    ...contents of ./argocd-deploy-key...
    -----END OPENSSH PRIVATE KEY-----
# ---------------------------------------------------------------------------
# Option B — fine-grained PAT (HTTPS). Only if you switch the repoURLs back to
# the https:// form; a deploy key cannot authenticate over HTTPS.
#   Create at  github.com/settings/personal-access-tokens  →  only this repo,
#   Repository permissions → Contents: Read-only. Nothing else is needed.
#   `username` is ignored by GitHub but must be non-empty.
#
#   Replace the three stringData lines above with:
#
#     url: https://github.com/Kovospace/kovostack-infra-gitops.git
#     username: kovo
#     password: github_pat_xxxxxxxx
#
# A classic PAT works too, but the narrowest scope it offers is `repo`, which
# grants write access to every repository you can see. Prefer A or a
# fine-grained token.
# ---------------------------------------------------------------------------