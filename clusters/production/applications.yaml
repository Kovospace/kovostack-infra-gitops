---
# Applies the ApplicationSet that generates every workload Application, in
# every environment, from environments/<env>/<app>.yaml. Kept as its own
# Application (rather than dropping the ApplicationSet into clusters/production)
# so it keeps wave 30 — workloads after the infrastructure they need — and so
# the Applications it replaced were adopted by name, not deleted and recreated.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
    targetRevision: main
    path: environments
    directory:
      # That one file and nothing else. environments/<env>/<app>.yaml are the
      # ApplicationSet's generator input, not Kubernetes objects; applying them
      # would fail on every sync.
      recurse: false
      include: 'applicationset.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Safe to prune: the only object here is the ApplicationSet, and deleting
      # it deletes no Application (see its finalizer and create-update policy).
      prune: true
      selfHeal: true