apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: paster-backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:

  project: applications

  sources:

    - repoURL: git@github.com:Kovospace/kovostack-helm-charts.git
      targetRevision: chart-app-1.7.0
      path: charts/app
      helm:
        valueFiles:
          - $values/applications/paster-backend/values.yaml
          - $values/versions/paster-backend.yaml

    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: paster-backend

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false