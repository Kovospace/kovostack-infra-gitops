---
# Two projects, so the Applications list can be filtered by Project in the UI:
# cluster plumbing in one, things you actually deploy in the other.
#
# They carry the earliest sync-wave in the repo because an Application that
# names a project which does not exist yet is rejected outright.
#
# `root` deliberately stays in the built-in `default` project: it is what
# creates these, and it cannot depend on itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Cluster infrastructure — ingress, certificates, secrets, storage
  # Upstream Helm repos as well as this one; the umbrella charts pull from them.
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      namespace: '*'
  # Unrestricted: this is the layer that installs CRDs, ClusterRoles,
  # StorageClasses and webhooks. Narrowing it here only breaks upgrades of the
  # upstream charts, which add resource kinds without asking.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Workloads deployed from the app chart
  # These two only — an app cannot be pointed at an arbitrary chart repository
  # without a commit here first. Both are needed because every app is
  # multi-source: the chart comes from kovostack-helm-charts at a pinned tag,
  # its values from this repo at main.
  sourceRepos:
    - git@github.com:Kovospace/kovostack-helm-charts.git
    - git@github.com:Kovospace/kovostack-infra-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  # Two kinds, both rendered by charts/app, so this cannot be empty — but
  # nothing here has any business creating a CRD, ClusterRole or StorageClass,
  # and now it cannot.
  #
  # ClusterSecretStore is cluster-scoped only so it can read the Infisical
  # machine identity out of the external-secrets namespace; each app renders one
  # scoped to its own folder. A namespaced SecretStore may only reference a
  # Secret in its own namespace, which would mean copying that credential into
  # every app namespace to gain nothing.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
# Non-production workloads, one project per environment: `applications-<env>`.
# The ApplicationSet (environments/applicationset.yaml) puts every Application
# generated from environments/<env>/ other than prod into it.
#
# Same repos and kinds as `applications`, but fenced to the environment's own
# names. A dev values file that forgets `name` — or copies the prod one — would
# otherwise render the prod Namespace, the prod ClusterSecretStore and a
# Deployment into the prod namespace, and ArgoCD would happily take them over.
# Here that sync is refused instead: namespaced resources may only land in
# `*-dev`, and the two cluster-scoped kinds are matched by name as well (the
# `name` glob on a whitelist entry needs ArgoCD >= 3.x; we run 3.5).
#
# Adding an environment means adding a copy of this project with its suffix.
# Without it the generated Applications report "project not found" and deploy
# nothing — which is the right way to fail.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Dev workloads deployed from the app chart — *-dev namespaces only
  sourceRepos:
    - git@github.com:Kovospace/kovostack-helm-charts.git
    - git@github.com:Kovospace/kovostack-infra-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*-dev'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
      name: '*-dev'
    # charts/app names it infisical-<name>, and <name> ends in -dev.
    - group: external-secrets.io
      kind: ClusterSecretStore
      name: 'infisical-*-dev'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
