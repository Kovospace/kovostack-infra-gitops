---
name: new-tab-links-backend
image: new-tab-links-backend
initContainers:
  - name: migrations
    image: new-tab-links-migrations

# Two pods: a crash or a rollout no longer takes the API down. Safe because
# nothing a request depends on lives in a pod - OAuth sign-in state is a sealed
# cookie, websocket refresh hints reach every pod through Postgres NOTIFY, and
# the admin lockout is a table (migrations V13). Still one node, so this does
# not survive the VM going down.
replicas: 2


# Nastavenie domény
# Spring Boot listens on 8080 (`server.port` defaults to 8080, chart default is
# the same). The Service and both probes target this port, so it has to match
# what the process actually binds — 4000 pointed them at nothing.
containerPort: 8080
host: api.tabilinks.app

# Probes render only when this is set. Actuator exposes health,info by default
# and has probes enabled, so /actuator/health answers from start-up.
healthPath: /actuator/health
# Separate probes (chart-app 1.5.0). /actuator/health includes the database, so as
# a liveness check a database outage restarted every pod at once - which fixes
# nothing. Liveness must not depend on what a restart cannot cure; readiness takes
# the pod out of the Service instead. Both sub-paths are public in the backend.
readinessPath: /actuator/health/readiness
livenessPath: /actuator/health/liveness

# Pripojenie na postgres databázu
externalServices:
  postgres:
    address: 172.17.0.1 # docker0 gateway — must be an IP, not a hostname
    port: 5432

# Volumes
# nie sú

env:

  ### AUTH settings
  # NEWTABLINKS_AUTH_JWT_SIGNING_SECRET: ${NEWTABLINKS_AUTH_JWT_SIGNING_SECRET} # presunuté do vault, min. 32 bajtov
  # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${...} # presunuté do vault
  # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${...} # presunuté do vault
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: openid,email,profile
  NEWTABLINKS_AUTH_JWT_ISSUER: https://api.tabilinks.app

  ### Database settings
  # SPRING_DATASOURCE_USERNAME: ${DB_USER} # presunuté do vault
  # SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD} # presunuté do vault
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/newtablinks
  # Schéma patrí migračnému init containeru (Flyway); Hibernate ju smie iba overiť.
  # Bez tejto premennej beží aplikácia s ddl-auto=update a ticho prepisuje
  # to, čo Flyway namigroval.
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  FLYWAY_URL: jdbc:postgresql://postgres:5432/newtablinks
  FLYWAY_CONNECT_RETRIES: 5
  FLYWAY_CONNECT_RETRIES_INTERVAL: 5
  # FLYWAY_USER a FLYWAY_PASSWORD sú vo vaulte — init container dedí ten istý
  # synced Secret cez envFrom. Bez nich Flyway skončí chybou a pod nenaštartuje.

  ### Mail sender settings
  NEWTABLINKS_MAIL_ENABLED: true
  # Na noreply@ netreba schránku — Brevo overuje doménu, nie prijímajúcu schránku.
  # Doména mail.tabilinks.app je v Brevo overená (DKIM, brevo-code, DMARC).
  NEWTABLINKS_MAIL_FROM_ADDRESS: "noreply@mail.tabilinks.app"
  # Zobrazované meno je voľný text; zhoduje sa s odosielateľom v Brevo.
  NEWTABLINKS_MAIL_FROM_NAME: "Tabilinks Robot"
  SPRING_MAIL_HOST: smtp-relay.brevo.com
  SPRING_MAIL_PORT: 2525
  # SPRING_MAIL_USERNAME: "" # presunuté do vault
  # SPRING_MAIL_PASSWORD: "" # presunuté do vault
  SPRING_MAIL_SMTP_AUTH: true
  SPRING_MAIL_SMTP_STARTTLS: true

  ### Frontend redirects settings
  # Základ odkazov v aktivačnom a reset-password maile. Prázdna hodnota tu
  # prebije default z application.properties a maily vedú nikam.
  NEWTABLINKS_WEB_BASE_URL: https://tabilinks.app
  # Cesty sedia s routami Angular stránky (application-route-paths.ts).
  NEWTABLINKS_WEB_ACTIVATION_PATH: /activate
  NEWTABLINKS_WEB_OAUTH_CALLBACK_PATH: /auth/callback
  NEWTABLINKS_WEB_PASSWORD_RESET_PATH: /reset-password
  # Zdieľaný, NIE tajný kľúč — púšťa web na GET /api/v1/auth/username-existence.
  # Kompiluje sa do verejného JS bundlu stránky, takže do vaultu nepatrí; tá istá
  # hodnota je v applications/new-tab-links-frontend/values.yaml. Nemá default a
  # prázdna hodnota znamená "zamietni všetko".
  # FRONTEND_API_KEY:

  ### Admin surface
  # Operátorské prihlásenie na /api/v1/admin — číta, mení a maže ľubovoľný účet
  # vrátane všetkých jeho pracovných plôch, skupín a odkazov. Nie je to účet:
  # žiadny riadok v databáze, žiadna registrácia, žiadny reset, žiadny druhý
  # faktor. Jedno heslo je celá stena medzi internetom a zmazaním hocičoho.
  #
  # ADMIN_USERNAME a ADMIN_PASSWORD sú preto vo vaulte — sem v otvorenej podobe
  # nepatria. Prázdna hodnota ktorejkoľvek z nich CELÝ admin vypne (každé
  # prihlásenie odmietne), čo je bezpečný default: nasadenie, ktoré ich zabudne,
  # príde o nástroj na opravy, nie o ochranu.
  # ADMIN_USERNAME: ${ADMIN_USERNAME} # presunuté do vault
  # ADMIN_PASSWORD: ${ADMIN_PASSWORD} # presunuté do vault, dlhé a náhodné
  #
  # Zamykanie po neúspešných pokusoch. Uvedené explicitne, hoci sa zhodujú s
  # defaultmi aplikácie: je to bezpečnostná politika a má byť čitateľná priamo
  # z nasadenia. POZOR — počítadlo žije v pamäti procesu, takže je per replika;
  # dve repliky znamenajú dvojnásobok pokusov, kým sa ktorákoľvek zamkne.
  ADMIN_USER_MAX_CONSECUTIVE_ATTEMPTS: 5
  ADMIN_USER_BAD_ATTEMPTS_LOCK_TIME: PT5M
  # Životnosť admin tokenu. Nemá obnovovací token — po vypršaní sa operátor
  # prihlási znova, čo je zámer. Default aplikácie je PT30M.
  # ADMIN_TOKEN_LIFETIME: PT30M

  ### CORS a websocket
  # Prehliadačové originy. Web aj rozšírenie volajú REST API...
  NEWTABLINKS_SECURITY_ALLOWED_CORS_ORIGINS: https://tabilinks.app,chrome-extension://*
  # ...a web si na to isté API otvára aj STOMP websocket, takže default
  # (iba chrome-extension://*) mu nestačí.
  NEWTABLINKS_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: https://tabilinks.app,chrome-extension://*

resources:
  requests:
    cpu: 250m
    # The JVM starts with InitialRAMPercentage=50 and grows to MaxRAMPercentage=75
    # of the limit (Dockerfile JAVA_OPTS): 256Mi of heap from the first second, up
    # to 384Mi. A 128Mi request let the scheduler place pods the node cannot hold.
    memory: 384Mi
  limits:
    memory: 512Mi
