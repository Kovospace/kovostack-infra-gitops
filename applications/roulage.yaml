apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: roulage
  namespace: argocd
  # No resources finalizer: this manifest is about to be handed over to the
  # ApplicationSet in environments/, and deleting the Application during that
  # handover must orphan the workload, not delete it.

spec:

  project: applications

  sources:

    ### Základné Kubernetes resources
    # Pinned. Possible only because the chart lives in a different repository —
    # ArgoCD refuses two revisions of the *same* repo, which is why this could
    # not be pinned while the chart sat in charts/app here.
    #
    # Upgrading is now a per-app decision: bump this, watch it, then move the
    # next app. A chart change no longer reaches everything at once.
    - repoURL: git@github.com:Kovospace/kovostack-helm-charts.git
      targetRevision: chart-app-1.3.0
      path: charts/app
      helm:
        # Order matters — later files win. versions/ is written by CI and
        # carries only the image tag, so a deploy never touches the file a
        # human edits.
        valueFiles:
          - $values/applications/roulage/values.yaml
          - $values/versions/roulage.yaml

      ### Pointer na referencovaý values.yaml
    # Stays on main so config and image-tag changes apply immediately; only the
    # chart above is pinned.
    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    # Must match `name` in the values file — the chart renders the Namespace,
    # so CreateNamespace stays off.
    namespace: roulage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false