---
# Example app — delete once you have a real one. Kept minimal on purpose: this
# is the whole configuration for a working, TLS-terminated, secret-consuming
# deployment.
name: whoami
# nginx rather than traefik/whoami: whoami is built FROM scratch, so it has no
# shell to write a test file with and never touches disk. nginx serves whatever
# is in the mounted directory, which makes persistence visible over HTTP.
image: nginx
imageTag: alpine
containerPort: 80
host: whoami.matejkovac.sk

# whoami has no secrets of its own; the Infisical folder /whoami need not exist
# for this to sync (a find over a missing folder returns nothing, it is not an
# error). Set to true once there is something to read.
#secrets:
#  enabled: false

# PVC example. Mounting over nginx' document root hides the image's default
# index.html, so the app returns 403 until something is written into the volume
# — which is itself proof the mount took effect.
#
# Key stays `data` (PVC name whoami-data) rather than being renamed to `html`:
# the claims carry Prune=false, so a rename would strand the existing one.
persistence:
  data:
    size: 128Mi
    mountPath: /usr/share/nginx/html

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi