apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nsr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:

  project: applications

  sources:

    ### Základné Kubernetes resources
    # NOT pinned to a chart tag, and it cannot be while the chart lives in this
    # repository: ArgoCD refuses a multi-source Application that references two
    # revisions of the same repo, and the $values source below must stay on main
    # so CI deploys take effect. See applications/README.md.
    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      path: charts/app
      helm:
        # Order matters — later files win. versions/ is written by CI and
        # carries only the image tag, so a deploy never touches the file a
        # human edits.
        valueFiles:
          - $values/applications/nsr/values.yaml
          - $values/versions/nsr.yaml

    ### Pointer na referencovaý values.yaml
    # Stays on main so config and image-tag changes apply immediately; only the
    # chart above is pinned.
    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    # Must match `name` in the values file — the chart renders the Namespace,
    # so CreateNamespace stays off.
    namespace: nsr

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false