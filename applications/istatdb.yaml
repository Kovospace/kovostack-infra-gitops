apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: istatdb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:

  project: applications

  sources:

    ### Základné Kubernetes resources
    - repoURL: git@github.com:Kovospace/kovostack-helm-charts.git
      targetRevision: chart-app-1.2.1
      path: charts/app
      helm:
        valueFiles:
          - $values/applications/istatdb/values.yaml
          - $values/versions/istatdb.yaml

    ### Pointer na referencovaý values.yaml
    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    # Must match `name` in the values file — the chart renders the Namespace,
    # so CreateNamespace stays off.
    namespace: istatdb

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false