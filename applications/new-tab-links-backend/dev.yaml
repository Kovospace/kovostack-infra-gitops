---
# new-tab-links-backend — dev only. Loaded after values.yaml, so these win.
# Application, namespace and chart name: new-tab-links-backend-dev.
#
# !!! Dev runs against PRODUCTION data for now, deliberately: the same
# database, the same Brevo account, the same Google OAuth client. Until the dev
# database exists:
#   - the `migrations` init container migrates the PRODUCTION schema. Moving
#     versions/new-tab-links-backend-dev-init.yaml ahead of prod's file applies
#     that schema to prod before prod's code is ready for it — the prod pods
#     then fail `ddl-auto: validate` on their next restart;
#   - anything dev writes, deletes or mails is real.
#
# Switching to a separate database later is a change to this file (the two
# URLs below, and `secrets.infisical.environmentSlug` → dev) and to Infisical's
# dev environment (the credentials, under the same /new-tab-links-backend
# folder) — nothing else.

# Namespace, Secret and Ingress all derive from this (the Infisical folder
# would too, but `secrets.path` below overrides it). Must equal the Application
# name.
name: new-tab-links-backend-dev

replicas: 1

# Secrets: prod's Infisical folder, prod environment — deliberately, for now.
# There is no /new-tab-links-backend-dev folder. The chart would otherwise
# derive /<name> (= /new-tab-links-backend-dev) from `name` above; `path` pins
# it to prod's folder instead. Only the lookup is shared: the synced Secret is
# still new-tab-links-backend-dev-secrets in the dev namespace, read through
# its own ClusterSecretStore infisical-new-tab-links-backend-dev.
#
# The later switch to real dev secrets: keep `path` exactly as it is, change
# `environmentSlug` to `dev`, fill /new-tab-links-backend in Infisical's *dev*
# environment, and make sure the machine identity behind the
# infisical-credentials Secret (external-secrets namespace) can read the dev
# environment — otherwise the ExternalSecret fails and the pods stop at
# CreateContainerConfigError.
secrets:
  path: /new-tab-links-backend
  infisical:
    environmentSlug: prod

# Nastavenie domény — pokryté wildcardom *.matejkovac.sk, certifikát per host
# cez HTTP-01. Konvencia pre dev: subdomény dev.matejkovac.sk.
host: api.tabilinks.dev.matejkovac.sk

env:
  ### AUTH settings
  # Its own issuer, so tokens minted here are not accepted as prod's (as far as
  # the backend checks `iss`).
  NEWTABLINKS_AUTH_JWT_ISSUER: https://api.tabilinks.dev.matejkovac.sk

  ### Database settings — PRODUCTION database, see the top of this file.
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/newtablinks
  FLYWAY_URL: jdbc:postgresql://postgres:5432/newtablinks

  ### Frontend redirects settings
  # Odkazy v maile vedú na dev web.
  NEWTABLINKS_WEB_BASE_URL: https://tabilinks.dev.matejkovac.sk

  ### CORS a websocket
  # Iba dev web (a rozšírenie) — prod web na dev API nesiaha.
  NEWTABLINKS_SECURITY_ALLOWED_CORS_ORIGINS: https://tabilinks.dev.matejkovac.sk,chrome-extension://*
  NEWTABLINKS_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: https://tabilinks.dev.matejkovac.sk,chrome-extension://*
