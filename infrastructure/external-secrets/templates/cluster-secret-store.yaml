---
# The shared store. Its only remaining consumer is the registry pull credential
# in /platform; every app reads its own secrets through a per-app store that
# charts/app renders, scoped to that app's folder.
#
# It used to serve the apps too, with each app narrowing via
# `dataFrom.find.path`. That does not work: external-secrets' Infisical provider
# never sends `find.path` to the API. It fetches whatever `secretsPath` below
# says — `/`, recursively — and flattens the whole project into a map keyed by
# secret name alone, so two folders holding the same key name collided and one
# app silently lost the value, with a green sync and no error. Scoping the
# *store* is the only thing that narrows the fetch, hence one store per app.
#
# Reached over the public edge rather than a host address: Infisical is
# published at SECRETS_HOST with a real certificate, while its container port is
# bound to 127.0.0.1 on the host and is not reachable from the cluster at all.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.infisical.storeName }}
  annotations:
    # After the CRDs, before anything that references the store.
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientId
            namespace: {{ .Release.Namespace }}
          clientSecret:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientSecret
            namespace: {{ .Release.Namespace }}
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        environmentSlug: {{ .Values.infisical.environmentSlug | quote }}
        # Root of the project, recursive, so a find for /platform below it
        # resolves. Kept as-is rather than narrowed to /platform: apps still on
        # an older chart tag read their own folders through this store, and
        # re-scoping it would empty their Secrets mid-rollout. Narrow it once
        # every app is on chart-app-1.3.0 or later.
        secretsPath: /
        recursive: true
