---
# Only what the gateway uses. RESTIC_PASSWORD also lives in /backup but is
# deliberately not copied here: the gateway stores ciphertext and never needs
# to decrypt it, so a compromised gateway cannot read the backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.name }}
spec:
  refreshInterval: {{ .Values.infisical.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.infisical.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.gateway.name }}
    creationPolicy: Owner
  data:
    {{- range list "STORAGEBOX_HOST" "STORAGEBOX_USER" "STORAGEBOX_SSH_PRIVATE_KEY" "STORAGEBOX_KNOWN_HOSTS" "RESTIC_REST_USERNAME" "RESTIC_REST_PASSWORD" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
