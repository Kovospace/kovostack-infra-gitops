---
# Infisical machine identity for the ClusterSecretStore. Applied by hand, like
# the repo credentials — external-secrets cannot fetch its own bootstrap
# credential.
#
#   Infisical → Organization → Access Control → Machine Identities → Create
#     auth method: Universal Auth
#   Then grant it read access to the project under
#     Project → Access Control → Machine Identities
#
# Apply without leaving the values in a file or your shell history:
#
#   read -rs -p 'client id: '     CID
#   read -rs -p 'client secret: ' CSEC
#   kubectl -n external-secrets create secret generic infisical-credentials \
#     --from-literal=clientId="$CID" --from-literal=clientSecret="$CSEC"
#   unset CID CSEC
#
# The namespace must match the external-secrets release namespace, because the
# ClusterSecretStore references it explicitly by namespace.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-credentials
  namespace: external-secrets
type: Opaque
stringData:
  clientId: "00000000-0000-0000-0000-000000000000"
  clientSecret: "..."