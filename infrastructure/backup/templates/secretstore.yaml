---
# /backup, and nothing else. Same construction as the per-app stores charts/app
# renders (see secretstore.yaml there): external-secrets' Infisical provider
# ignores `find.path` on an ExternalSecret and fetches whatever the *store* is
# scoped to, so scoping the store is the only thing that keeps this folder's
# keys from colliding with same-named keys elsewhere in the project.
#
# Cluster-scoped so it can read the machine identity out of the
# external-secrets namespace, and so app namespaces can point an ExternalSecret
# at it for RESTIC_PASSWORD and the gateway credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.infisical.storeName }}
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientId
            namespace: {{ .Values.infisical.credentialsNamespace }}
          clientSecret:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientSecret
            namespace: {{ .Values.infisical.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        environmentSlug: {{ .Values.infisical.environmentSlug | quote }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
        recursive: false
