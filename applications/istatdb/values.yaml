---
name: istatdb
image: istatdb-frontend

containerPort: 3000
host: istatdb.matejkovac.sk
wwwAlias: true

persistence:
  db:
    # SQLite database.
    size: 128Mi
    mountPath: var/app/db

env:
  RAILS_ENV: production

# Infisical folder /istatdb must hold BASIC_AUTH_USER and BASIC_AUTH_PASSWORD:
# the image's nginx refuses to start without them (docker-entrypoint.sh).
secrets:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 768Mi

#replicas: 0