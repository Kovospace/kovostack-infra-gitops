---
# Second-level app-of-apps: every Application manifest dropped into
# applications/ is picked up automatically once infrastructure is up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
    targetRevision: main
    path: applications
    directory:
      # NOT recursive, deliberately. Application manifests live at
      # applications/*.yaml; each app's values live in applications/<app>/ and
      # are pulled in by the Application itself via the $values source ref.
      # Recursing would try to apply those values.yaml files as manifests.
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true