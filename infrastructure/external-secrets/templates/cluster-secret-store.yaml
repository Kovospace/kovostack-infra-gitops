---
# One store for the whole cluster. Apps do not get their own store — they scope
# themselves with `dataFrom.find.path` instead (see charts/app), which is what
# keeps a new app to a values file and nothing else.
#
# Reached over the public edge rather than a host address: Infisical is
# published at SECRETS_HOST with a real certificate, while its container port is
# bound to 127.0.0.1 on the host and is not reachable from the cluster at all.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.infisical.storeName }}
  annotations:
    # After the CRDs, before anything that references the store.
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientId
            namespace: {{ .Release.Namespace }}
          clientSecret:
            name: {{ .Values.infisical.credentialsSecret }}
            key: clientSecret
            namespace: {{ .Release.Namespace }}
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        environmentSlug: {{ .Values.infisical.environmentSlug | quote }}
        # Root of the project; each app narrows to its own folder. `recursive`
        # is what lets a find below the root descend into those folders.
        secretsPath: /
        recursive: true
