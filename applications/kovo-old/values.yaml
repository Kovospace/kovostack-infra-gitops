---
name: kovo-old
image: kovospace-frontend-old

containerPort: 3000
host: old.matejkovac.sk
wwwAlias: true

persistence:
  db:
    # SQLite database.
    size: 128Mi
    mountPath: /var/app/db/databases
  uploads:
    size: 10Gi
    mountPath: /var/app/public/uploads

env:
  RAILS_ENV: production
  RAILS_SERVE_STATIC_FILES: true

secrets:
  enabled: false

# Nightly K8up backup to the Storage Box (charts/app README, "Backups").
# Both volumes are backed up file by file; the live SQLite file is left out of
# that and dumped consistently with VACUUM INTO instead. Retention and the
# check/prune slots are the chart defaults.
backup:
  enabled: true
  schedule:
    # Evenings, Europe/Bratislava. Check and prune keep their derived night
    # slots (04:xx–08:xx), well clear of this.
    backup: "45 20 * * *"
  sqlite:
    files:
      # Rails production DB: config/database.yml `db/databases/production.sqlite3`,
      # relative to WORKDIR /var/app. No DATABASE_URL at runtime overrides it.
      - /var/app/db/databases/production.sqlite3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

#replicas: 0