---
name: nsr
image: nsr-frontend
# imageTag lives in versions/nsr.yaml — written by CI, loaded after this file.
# Setting it here too would create a second source of truth that always loses.

containerPort: 3000
host: neser.matejkovac.sk
wwwAlias: true

persistence:
  data:
    # SQLite database.
    size: 128Mi
    mountPath: /app/data
  uploads:
    # Uploaded flyers and DJ sets. Inside Next.js' public/ tree, so these are
    size: 10Gi
    mountPath: /app/public/media

env:
  DATABASE_URI: file:/app/data/nsr.db
  # PAYLOAD_SECRET: "" # Moved into vault
  NEXT_PUBLIC_SERVER_URL: https://neser.sk
  # Extra origins (comma-separated) allowed to log into the admin / call the
  # API, in addition to NEXT_PUBLIC_SERVER_URL. Only needed when the site is
  # reached from more than one origin (e.g. bare IP for testing, or www).
  ALLOWED_ORIGINS: https://www.neser.sk,https://neser.sk,https://neser.matejkovac.sk,https://www.neser.matejkovac.sk

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi