---
name: nsr
image: registry.matejkovac.sk/nsr-frontend
imageTag: sha-a4acb4c
containerPort: 3000
host: nsr.matejkovac.sk

# The two bind mounts from the docker-compose deployment, as claims. The
# mountPaths must stay exactly as they were there — they are what the app is
# configured to write to, and a mismatch means it writes into the container
# filesystem instead and loses everything on the next restart.
persistence:
  data:
    # was /home/kovo/docker/volumes/nsr/sqlite/db
    # SQLite database. Small, but the one thing that must not be lost.
    size: 128Mi
    mountPath: /app/data
  uploads:
    # was /home/kovo/docker/volumes/nsr/media
    # Uploaded flyers and DJ sets. Inside Next.js' public/ tree, so these are
    # served as static files — only the media subdirectory is shadowed by the
    # mount, the rest of public/ still comes from the image.
    #
    # Sized for growth: k3s' local-path class has no allowVolumeExpansion, so
    # growing this later means a new claim and a copy. DJ sets are audio; 10Gi
    # goes faster than it looks.
    size: 10Gi
    mountPath: /app/public/media

env:
  DATABASE_URI: file:/app/data/nsr.db
  # PAYLOAD_SECRET: "" # Moved into vault
#  NEXT_PUBLIC_SERVER_URL: https://neser.sk
  # Extra origins (comma-separated) allowed to log into the admin / call the
  # API, in addition to NEXT_PUBLIC_SERVER_URL. Only needed when the site is
  # reached from more than one origin (e.g. bare IP for testing, or www).
#  ALLOWED_ORIGINS: https://www.neser.sk,https://neser.sk

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi