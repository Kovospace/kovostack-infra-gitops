apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: music-pages-scraper-backend
  namespace: argocd
  # No resources finalizer: this manifest is about to be handed over to the
  # ApplicationSet in environments/, and deleting the Application during that
  # handover must orphan the workload, not delete it.

spec:

  project: applications

  sources:

    - repoURL: git@github.com:Kovospace/kovostack-helm-charts.git
      targetRevision: chart-app-1.3.0
      path: charts/app
      helm:
        valueFiles:
          - $values/applications/music-pages-scraper-backend/values.yaml
          - $values/versions/music-pages-scraper-backend.yaml

    - repoURL: git@github.com:Kovospace/kovostack-infra-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: music-pages-scraper-backend

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false